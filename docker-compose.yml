version: "3.8"

services:
  app:
    build: .
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=127.0.0.1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/launchbox
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=launchbox
    ports:
      - "5433:5432"
